[package]
name = "stfu"
version = "0.2.0"
edition = "2024"
authors = ["horizzon3507 <148660626+horizzon3507@users.noreply.github.com>"]
description = "Kill switch for all microphones (PipeWire/WirePlumber)"
license = "MIT"
repository = "https://github.com/horizzon3507/stfu"
keywords = ["pipewire", "wireplumber", "microphone", "killswitch", "audio"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thiserror = "2.0"

[build-dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { version = "1.0", features = ["derive"] }
